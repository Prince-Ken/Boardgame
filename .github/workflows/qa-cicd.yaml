name: Boardgame QA CI/CD

on:
  push:
    branches:
      - qa
    paths:
      - ".github/workflows/qa-cicd.yaml"
      - "Dockerfile"
      - "src/**"
      - "pom.xml"
      - "k8-manifest/**"

permissions:
  contents: read
  id-token: write

jobs:

  # ==========================================
  # 1. GITLEAKS - SECRET SCANNING
  # ==========================================
  gitleaksScan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v3
        with:
          args: "--verbose --redact"


  # ==========================================
  # 2. CHECKOV - IaC / DOCKERFILE SCANNING
  # ==========================================
  checkov:
    name: Checkov scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true


  # ==========================================
  # 3. BUILD + SECURITY SCAN + PUSH
  # ==========================================
  docker:
    name: Build, scan and push Docker image
    runs-on: ubuntu-latest

    needs:
      - gitleaksScan
      - checkov

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Docker Hub login
      # ----------------------------------------
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # Build image
      # ----------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:qa
            ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.sha }}

      # ----------------------------------------
      # Trivy image scan
      # ----------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:qa
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ----------------------------------------
      # Build and push image
      # ----------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:qa
            ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.sha }}


  # ==========================================
  # 4. DEPLOY TO EKS
  # ==========================================
  deploy:
    name: Deploy to EKS QA
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # AWS authentication using GitHub OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::198716474374:role/GitHubActions-Boardgame-QA
          aws-region: eu-west-3

      # ----------------------------------------
      # Verify AWS identity
      # ----------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------
      # Configure kubectl
      # ----------------------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name my-cluster \
            --region eu-west-3

      # ----------------------------------------
      # Verify Kubernetes access
      # ----------------------------------------
      - name: Verify Kubernetes access
        run: |
          kubectl get deployment boardgame \
            -n boardgame-qa

      # ----------------------------------------
      # Deploy new image
      # ----------------------------------------
      - name: Deploy Boardgame
        run: |
          kubectl set image deployment/boardgame \
            boardgame=${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.sha }} \
            -n boardgame-qa

      # ----------------------------------------
      # Wait for rollout
      # ----------------------------------------
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/boardgame \
            -n boardgame-qa \
            --timeout=180s

      # ----------------------------------------
      # Show deployment
      # ----------------------------------------
      - name: Verify deployment
        run: |
          kubectl get deployment boardgame \
            -n boardgame-qa

          kubectl get pods \
            -n boardgame-qa