apiVersion: apps/v1
kind: Deployment  
metadata:
  name: boardgame
  namespace: boardgame-qa

spec:
  replicas: 2
  selector:
    matchLabels:
      app: boardgame
  
  template:
    metadata:
      labels:
        app: boardgame

    spec:
      containers:
        - name: boardgame
          image: taahken/boardgame:qa
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3